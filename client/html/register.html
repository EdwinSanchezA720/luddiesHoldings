<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Luddies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../style/tokens.css">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/components.css">
    <link rel="stylesheet" href="../style/pages/auth.css">
    <script src="../js/luddies-storage-keys.js"></script>
    <script src="../js/catalog-seed.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/auth-guard.js"></script>
</head>
<body class="page-auth">
    <header class="page-auth__hero">
        <div class="container">
            <div class="page-auth__brand">
                <img src="../images/brand/luddies-imagotipo-alt.png" width="56" height="56" alt="" data-i18n="logo_alt">
            </div>
        </div>
    </header>

    <main class="flex-grow-1">
        <div class="container">
            <div class="page-auth__card" style="max-width: 480px;">
                <h1 class="page-auth__title" data-i18n="auth_register_title">Create account</h1>
                <p class="page-auth__lead" data-i18n="auth_register_lead">Join Luddies to access the platform.</p>

                <div class="alert alert-danger d-none" id="register-error-alert" role="alert"></div>

                <form id="register-form" novalidate>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="reg-fullname" name="fullName" placeholder=" " autocomplete="name" required>
                        <label for="reg-fullname" data-i18n="auth_label_fullname">Full name</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="tel" class="form-control" id="reg-phone" name="phone" placeholder=" " autocomplete="tel" required>
                        <label for="reg-phone" data-i18n="auth_label_phone">Phone</label>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="reg-email" name="email" placeholder=" " autocomplete="email" required>
                        <label for="reg-email" data-i18n="auth_label_email">Email</label>
                    </div>
                    <div class="row g-2">
                        <div class="col-12 col-md-6">
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="reg-password" name="password" placeholder=" " autocomplete="new-password" required>
                                <label for="reg-password" data-i18n="auth_label_password">Password</label>
                            </div>
                        </div>
                        <div class="col-12 col-md-6">
                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="reg-confirm" name="confirm" placeholder=" " autocomplete="new-password" required>
                                <label for="reg-confirm" data-i18n="auth_label_confirm">Confirm password</label>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-luddies btn-luddies--primary w-100" data-i18n="auth_btn_register">Register</button>
                </form>

                <p class="page-auth__footer">
                    <a href="login.html" data-i18n="auth_link_signin">Back to sign in</a>
                </p>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/register.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            if (window.LuddiesI18n) window.LuddiesI18n.applyTranslations(window.LuddiesI18n.getLang());
        });
    </script>
</body>
</html>
