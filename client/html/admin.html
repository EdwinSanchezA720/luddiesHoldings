<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Luddies</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../style/tokens.css">
    <link rel="stylesheet" href="../style/base.css">
    <link rel="stylesheet" href="../style/components.css">
    <link rel="stylesheet" href="../style/layout.css">
    <link rel="stylesheet" href="../style/pages/admin.css">
    <script src="../js/luddies-storage-keys.js"></script>
    <script src="../js/catalog-seed.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/auth-guard.js"></script>
</head>
<body class="page-admin" data-site-page="admin">
    <header id="site-header"></header>

    <main>
        <section class="hero-about catalog-hero">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-12 col-lg-9 text-center fade-in">
                        <h1 class="hero-title mb-3" data-i18n="admin_page_title">Admin</h1>
                        <p class="hero-lead mx-auto mb-0" data-i18n="admin_hero_lead">Products and users.</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="page-section pt-0">
            <div class="container">
                <div class="alert alert-warning d-none" id="admin-page-error" role="alert"></div>
                <ul class="nav nav-pills gap-2 mb-4" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active" id="admin-tab-pill" data-bs-toggle="pill" data-bs-target="#admin-tab-products" type="button" role="tab" data-i18n="admin_tab_products">Products</button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link" id="admin-tab-users-pill" data-bs-toggle="pill" data-bs-target="#admin-tab-users" type="button" role="tab" data-i18n="admin_tab_users">Users</button>
                    </li>
                </ul>

                <div class="tab-content">
                    <div class="tab-pane fade show active" id="admin-tab-products" role="tabpanel">
                        <div class="admin-toolbar">
                            <h2 class="h5 mb-0" data-i18n="admin_tab_products">Products</h2>
                            <button type="button" class="btn btn-luddies btn-luddies--primary" id="admin-btn-new-product" data-i18n="admin_btn_add_product">New product</button>
                        </div>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="admin-table-head">
                                    <tr>
                                        <th scope="col" data-i18n="admin_col_id">ID</th>
                                        <th scope="col" data-i18n="admin_col_name">Name</th>
                                        <th scope="col" data-i18n="admin_col_category">Category</th>
                                        <th scope="col" data-i18n="admin_col_actions">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-products-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="admin-tab-users" role="tabpanel">
                        <h2 class="h5 mb-3" data-i18n="admin_tab_users">Users</h2>
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="admin-table-head">
                                    <tr>
                                        <th scope="col" data-i18n="admin_user_col_name">Name</th>
                                        <th scope="col" data-i18n="admin_user_col_email">Email</th>
                                        <th scope="col" data-i18n="admin_user_col_role">Role</th>
                                        <th scope="col" data-i18n="admin_col_actions">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="admin-users-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer" class="footer-lite"></footer>

    <div class="modal fade" id="product-form-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header border-bottom-0">
                    <h2 class="modal-title h5" data-i18n="admin_modal_product_title">Product</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="alert alert-danger d-none" id="admin-form-error" role="alert"></div>
                    <form id="product-form" novalidate>
                        <input type="hidden" id="product-id" name="id" value="">
                        <div class="form-floating mb-2">
                            <input type="url" class="form-control" id="product-img" name="img" placeholder=" " required>
                            <label for="product-img" data-i18n="admin_form_img">Image URL</label>
                        </div>
                        <div class="mb-2">
                            <label class="form-label" for="product-category-preset" data-i18n="admin_form_category">Category</label>
                            <select class="form-select" id="product-category-preset" name="categoryPreset" required>
                                <option value="" data-i18n="admin_category_select_placeholder">— Choose —</option>
                                <option value="science" data-i18n="cat_filter_science">Science</option>
                                <option value="technology" data-i18n="cat_filter_technology">Technology</option>
                                <option value="engineering" data-i18n="cat_filter_engineering">Engineering</option>
                                <option value="mathematics" data-i18n="cat_filter_mathematics">Mathematics</option>
                                <option value="neurodiversity" data-i18n="cat_filter_neurodiversity">Neurodiversity</option>
                                <option value="certification" data-i18n="cat_filter_certification">Certification</option>
                                <option value="physical" data-i18n="cat_filter_physical">Physical kits</option>
                                <option value="dissidents" data-i18n="cat_filter_dissidents">STEM Dissidents</option>
                                <option value="__other__" data-i18n="admin_category_option_other">Other</option>
                            </select>
                        </div>
                        <div id="product-category-custom-wrap" class="d-none mb-2">
                            <label class="form-label" for="product-category-custom" data-i18n="admin_category_custom_label">Custom tags</label>
                            <input type="text" class="form-control" id="product-category-custom" name="categoryCustom" placeholder="e.g. certification mathematics" autocomplete="off">
                            <p class="form-text small text-secondary mb-0" id="product-category-custom-hint" data-i18n="admin_category_custom_help"></p>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="product-purchasable" data-i18n="admin_form_purchasable">Purchasable</label>
                            <select class="form-select" id="product-purchasable" name="purchasable">
                                <option value="1" data-i18n="admin_option_yes">Yes</option>
                                <option value="0" data-i18n="admin_option_no">No</option>
                            </select>
                        </div>
                        <p class="small text-secondary mb-2" data-i18n="admin_form_bilingual_note">Bilingual</p>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <div class="form-floating mb-2">
                                    <input type="text" class="form-control" id="product-name-es" name="nameEs" placeholder=" " required>
                                    <label for="product-name-es" data-i18n="admin_form_name_es">Title (ES)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-2">
                                    <input type="text" class="form-control" id="product-name-en" name="nameEn" placeholder=" " required>
                                    <label for="product-name-en" data-i18n="admin_form_name_en">Title (EN)</label>
                                </div>
                            </div>
                        </div>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <div class="form-floating mb-2">
                                    <textarea class="form-control" id="product-desc-es" name="descEs" placeholder=" " style="height: 5rem" required></textarea>
                                    <label for="product-desc-es" data-i18n="admin_form_desc_es">Description (ES)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-2">
                                    <textarea class="form-control" id="product-desc-en" name="descEn" placeholder=" " style="height: 5rem" required></textarea>
                                    <label for="product-desc-en" data-i18n="admin_form_desc_en">Description (EN)</label>
                                </div>
                            </div>
                        </div>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <div class="form-floating mb-2">
                                    <input type="text" class="form-control" id="product-meta-es" name="metaEs" placeholder=" " required>
                                    <label for="product-meta-es" data-i18n="admin_form_meta_es">Meta (ES)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-2">
                                    <input type="text" class="form-control" id="product-meta-en" name="metaEn" placeholder=" " required>
                                    <label for="product-meta-en" data-i18n="admin_form_meta_en">Meta (EN)</label>
                                </div>
                            </div>
                        </div>
                        <div class="row g-2">
                            <div class="col-md-6">
                                <div class="form-floating mb-2">
                                    <input type="text" class="form-control" id="product-price-es" name="priceEs" placeholder=" " required>
                                    <label for="product-price-es" data-i18n="admin_form_price_es">Price (ES)</label>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="form-floating mb-2">
                                    <input type="text" class="form-control" id="product-price-en" name="priceEn" placeholder=" " required>
                                    <label for="product-price-en" data-i18n="admin_form_price_en">Price (EN)</label>
                                </div>
                            </div>
                        </div>
                        <div class="d-flex flex-wrap gap-2 justify-content-end pt-2">
                            <button type="button" class="btn btn-luddies btn-luddies--outline" data-bs-dismiss="modal" data-i18n="admin_form_cancel">Cancel</button>
                            <button type="submit" class="btn btn-luddies btn-luddies--primary" data-i18n="admin_form_save">Save</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirm-delete-product-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-body">
                    <p data-i18n="admin_confirm_delete_product">Delete this product?</p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-luddies btn-luddies--outline" data-bs-dismiss="modal" data-i18n="admin_form_cancel">Cancel</button>
                    <button type="button" class="btn btn-luddies btn-luddies--secondary" id="confirm-delete-product-ok" data-i18n="admin_btn_delete">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="confirm-delete-user-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-body">
                    <p data-i18n="admin_confirm_delete_user">Delete this user?</p>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-luddies btn-luddies--outline" data-bs-dismiss="modal" data-i18n="admin_form_cancel">Cancel</button>
                    <button type="button" class="btn btn-luddies btn-luddies--secondary" id="confirm-delete-user-ok" data-i18n="admin_user_delete">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script defer src="../js/i18n.js"></script>
    <script defer src="../js/layout.js"></script>
    <script defer src="../js/auth-ui.js"></script>
    <script defer src="../js/fade-in.js"></script>
    <script defer src="../js/admin-panel.js"></script>
    <script>
        document.addEventListener("luddies:layout-ready", function () {
            if (window.LuddiesI18n) window.LuddiesI18n.applyTranslations(window.LuddiesI18n.getLang());
        });
    </script>
</body>
</html>
